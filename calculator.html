<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
 <h1>Simple Calculator</h1>
</body>
<script>
    let num1=+prompt("Enter first number:");
    let num2=+prompt("Enter second number:");
    let operator=prompt("Enter operator (+, -, *, /):");
    let result=0;
    if(operator=="+"){
       result=num1+num2; 
    }
    if(operator=="-"){
        result=num1-num2; 
     }
     if(operator=="*"){
        result=num1*num2; 
     }
     if(operator=="/"){
        result=num1/num2; 
     }
     alert("Result: "+result);
</script>
</html>
